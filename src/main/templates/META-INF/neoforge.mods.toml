modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# Lets the mod stay installed when joining servers that don't have it.
# Elytra flight can still be STARTED on such servers; stopping needs the mod server-side.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional - the mod works fully without Curios; this just lets NeoForge order load
# correctly (after Curios) if the player has it installed.
[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[9.0.0,)"
ordering = "AFTER"
side = "BOTH"
